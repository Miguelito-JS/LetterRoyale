# =====================================================================
#  Configurações do LetterRoyale
#  Os valores vêm de VARIÁVEIS DE AMBIENTE. O que está depois do ":" é o padrão.
#  Ex.: ${DB_PASSWORD:} -> usa a variável DB_PASSWORD, senão vazio.
#  Dica: no IntelliJ, Run > Edit Configurations > Environment variables.
#  NUNCA escreva senha/token de verdade aqui e suba pro GitHub.
# =====================================================================
server.port=${PORT:8080}

# Segredos locais (fora do classpath e ignorados pelo Git). O arquivo antigo na raiz
# continua aceito; se a mesma chave existir nos dois, segredos/ tem prioridade.
spring.config.import=optional:file:./segredos.properties,optional:file:../segredos.properties,optional:file:./segredos/segredos.properties,optional:file:../segredos/segredos.properties

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:letterroyale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Login (JWT) --- precisa ter pelo menos 32 caracteres
app.jwt.segredo=${JWT_SECRET:troque-isso-por-um-texto-bem-grande-e-aleatorio-1234567890}
app.jwt.validade-dias=7

# --- TMDB (filmes) --- https://www.themoviedb.org/settings/api  (API Read Access Token)
app.tmdb.token=${TMDB_TOKEN:}
app.tmdb.idioma=${TMDB_LANG:pt-BR}
app.tmdb.regiao=${TMDB_REGION:BR}

# --- Lâmpada inteligente (Tuya / Tramontina) --- ver LAMPADA.md
# Deixe vazio = MODO SIMULAÇÃO (o site funciona e só mostra no log o que mandaria pra lâmpada)
app.tuya.client-id=${TUYA_CLIENT_ID:}
app.tuya.secret=${TUYA_SECRET:}
app.tuya.device-id=${TUYA_DEVICE_ID:}
# Data center da conta Smart Life. Brasil normalmente = Western America
app.tuya.url=${TUYA_URL:https://openapi.tuyaus.com}

# --- Modo desenvolvimento: mostra o código de recuperação de senha na tela ---
app.modo-dev=${MODO_DEV:true}

# --- Site (front-end) --- serve a pasta frontend/ (funciona rodando de dentro de backend/ ou da raiz)
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/

# --- JSON ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
