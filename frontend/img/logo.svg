<svg xmlns="http://www.w3.org/2000/svg" width="58" height="52" viewBox="-1 -10 58 52" fill="none">
  <!-- Claquete do Figma (Hi-Fi Início > Group 15). Animação do Figma: a tampa gira de -25° até 0°
       no 1º segundo, fica parada no 2º e repete (2s, linear). O viewBox sobe 10px pra tampa não ser cortada. -->
  <style>
    .tampa {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: claquete 2s linear infinite;
    }
    @keyframes claquete {
      0%   { transform: rotate(-25deg); }
      50%  { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tampa { animation: none; }
    }
  </style>

  <!-- Tampa (parte que abre e fecha) -->
  <g class="tampa">
    <rect x="0.487883" y="0.499853" width="45.5632" height="5.46806" transform="matrix(1 0 -0.0242333 0.999706 6.78457 2.00149)" fill="#F2F2F5" stroke="#201A1B"/>
